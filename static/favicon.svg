<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#383a40"/>
      <stop offset="100%" stop-color="#1e1f22"/>
    </radialGradient>
    
    <linearGradient id="blurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7289da"/>
      <stop offset="100%" stop-color="#4752c4"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <g filter="url(#shadow)">
    <!-- Magnifying Glass Handle -->
    <rect x="300" y="300" width="48" height="150" rx="24" transform="rotate(-45 300 300)" fill="url(#blurpleGrad)" />
    
    <!-- Magnifying Glass Outer Ring -->
    <circle cx="210" cy="210" r="140" fill="none" stroke="url(#blurpleGrad)" stroke-width="28"/>

    <!-- Lens Fill -->
    <circle cx="210" cy="210" r="126" fill="url(#glassGrad)"/>

    <!-- Discord Chat Bubble Base Shape -->
    <path d="M 140 150 
             C 140 135, 152 123, 167 123 
             L 253 123 
             C 268 123, 280 135, 280 150 
             L 280 210 
             C 280 225, 268 237, 253 237 
             L 225 237 
             L 190 262 
             L 195 237 
             L 167 237 
             C 152 237, 140 225, 140 210 
             Z" 
          fill="#5865f2"/>

    <!-- Cutout Eyes inside Chat Bubble (Styled like little paw pads / Discord eyes) -->
    <circle cx="185" cy="175" r="12" fill="#ffffff"/>
    <circle cx="235" cy="175" r="12" fill="#ffffff"/>

    <!-- Cute Paw Print Emblem on Lens -->
    <!-- Main Pad -->
    <path d="M 210 205 C 200 205, 192 215, 195 224 C 198 230, 204 233, 210 233 C 216 233, 222 230, 225 224 C 228 215, 220 205, 210 205 Z" fill="#ffffff"/>
    <!-- Toe Beans -->
    <circle cx="193" cy="198" r="4.5" fill="#ffffff"/>
    <circle cx="204" cy="193" r="4.5" fill="#ffffff"/>
    <circle cx="216" cy="193" r="4.5" fill="#ffffff"/>
    <circle cx="227" cy="198" r="4.5" fill="#ffffff"/>

    <!-- Glass Lens Highlight Curve -->
    <path d="M 120 170 A 110 110 0 0 1 240 100" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
